name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format check
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  auto-tag:
    name: Auto-tag on version bump
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect version bump and push tag
        run: |
          git show HEAD~1:package.json > /tmp/prev-pkg.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/prev-pkg.json
          prev=$(node -e "console.log(require('/tmp/prev-pkg.json').version)")
          curr=$(node -e "console.log(require('./package.json').version)")
          echo "Previous: $prev  →  Current: $curr"

          # Exit 0 (bump detected) only if curr is strictly greater than prev
          node -e "
            const [p,c] = ['$prev','$curr'].map(v=>v.split('.').map(Number));
            for(let i=0;i<3;i++){if(c[i]>p[i])process.exit(0);if(c[i]<p[i])process.exit(1);}
            process.exit(1);
          " || { echo "No version bump — skipping tag."; exit 0; }

          tag="v$curr"
          if git ls-remote --tags origin "$tag" | grep -q "refs/tags/$tag"; then
            echo "Tag $tag already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "Pushed $tag — build pipeline will now start."

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts

      - name: Sync version from tag
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          npm version "$ver" --no-git-tag-version

      - name: Download yt-dlp (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"

      - name: Download yt-dlp (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o bin/yt-dlp
          chmod +x bin/yt-dlp

      - name: Generate icon.icns (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out icon.iconset/icon_${size}x${size}.png
          done
          sips -z 32 32 assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 64 64 assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 256 256 assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 512 512 assets/icon.png --out icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns
          rm -rf icon.iconset

      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-all
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/**/*
          generate_release_notes: true
